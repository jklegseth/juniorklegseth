<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Equisolve Stellar Biotechnologies Lazy Load Example</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    /*
      body, h1 styles taken from Stellar Technoligies CSS, as were
      some colors for the press releases.
    */
    body {
      font-family: 'Open Sans',sans-serif;
      font-weight: 400;
      color: #4b4b4b;
      font-size: .875rem;
      line-height: 20px;
      letter-spacing: -0.008em;
      -webkit-font-smoothing: antialiased;
      font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1 {
      margin: 25px 0 0;
      font-weight: 700;
      font-size: 1.5rem;
      color: #22a99d;
    }

    .releases {
      margin: 5px 15px;
      max-width: 800px;
    }

    .release {
      border-top: 1px dashed #ddd;
      padding: 12px 0;
    }

    .release:first-child {
      border-top: 0;
    }

    .release__title {
      font-weight: 600;
      font-size: .875rem;
      color: #22a99d;
    }

    .release__timestamp {
      font-weight: 300;
      font-size: .75rem;
      color: #18577a;
    }
  </style>


</head>
<body>
  <header>
    <img src="http://c.eqcdn.com/stellarbiotechnologies/files/images/logo.png" width="209" height="75" alt="Stellar Biotechnologies - Powering and Improving Immunotherapy">
  </header>

  <article class="main">
    <h1>
      Press Releases
    </h1>
    <div class="releases"></div>
  </article>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
