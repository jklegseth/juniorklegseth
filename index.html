<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Junior Klegseth: sTuFf</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <style type="text/css">
      
      li {
        list-style: none;
        padding: 10px 0;
      }
      
      span, a {
        display: none;
      }
      
      p span {
        font-size: .7em;
      }
      
      strong {
        font-size: 1.5em;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <strong>sTuFf</strong>: <span>hmmmmmm</span>
      </li>
      
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
    <script type="text/javascript" src="jquery.text-effects.js"></script>
    <script type="text/javascript">
      $(document).ready(function(){
      
        $('li').each(function(){
          $(this).css('margin-left', Math.floor(Math.random() * 401) - 200 + 'px');
        });
        var speed = 2000;
        var elements = $("span, a");
        var length = elements.length;
        var index = 0;
        var timer = setInterval(doScramble, speed);
        
        function doScramble(){
          $(elements.eq(index)).show().scrambledWriter();
          index++;
          if (index >= length) {
            clearInterval(timer);
          }
        }
      });
    </script>
  </body>
</html>
